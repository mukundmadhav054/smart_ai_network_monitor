all:
  children:
    routers:
      hosts:
        r1:
          ansible_host: 172.20.20.11
          ansible_user: root
        r2:
          ansible_host: 172.20.20.12
          ansible_user: root
    lab_hosts:
      hosts:
        host1:
          ansible_host: 172.20.20.21
          ansible_user: root
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_connection: ssh
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    dry_run: true
    canary: true
    rollback: false
