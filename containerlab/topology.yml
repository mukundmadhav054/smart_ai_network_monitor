name: samn-lab

topology:
  nodes:
    r1:
      kind: linux
      image: frrouting/frr:9.0.2
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    r2:
      kind: linux
      image: frrouting/frr:9.0.2
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    host1:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest

  links:
    - endpoints: ["host1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
