all:
  children:
    routers:
      vars:
        ansible_connection: network_cli
        ansible_network_os: frr
        ansible_user: "{{ lookup('env', 'ANSIBLE_REMOTE_USER') | default('admin', true) }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_SSH_PRIVATE_KEY') | default('~/.ssh/id_rsa', true) }}"
      hosts:
        r1:
          ansible_host: 172.20.20.11
        r2:
          ansible_host: 172.20.20.12
    lab_hosts:
      vars:
        ansible_connection: ssh
        ansible_user: "{{ lookup('env', 'ANSIBLE_REMOTE_USER') | default('admin', true) }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_SSH_PRIVATE_KEY') | default('~/.ssh/id_rsa', true) }}"
      hosts:
        host1:
          ansible_host: 172.20.20.21
  vars:
    ansible_python_interpreter: /usr/bin/python3
    dry_run: true
    canary: true
    rollback: false
