name: Spellcheck

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  cspell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Spellcheck
        uses: streetsidesoftware/cspell-action@v6
        with:
          config: cspell.json
          files: "**/*.{md,py,yml,yaml,sh}"
